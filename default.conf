server {
       listen         80;
       listen    [::]:80;
       server_name    data.virtualflybrain.org;

       root   /usr/share/nginx/html/;

       index index.html index.htm index.nginx-debian.html;

       # --------------------------------------------------------------------
       # Caching
       #
       # This previously cached *everything* for a year as `immutable`:
       #
       #     expires 1y;
       #     add_header Cache-Control public;
       #     add_header Cache-Control immutable;
       #
       # That is right for a file whose URL changes when its content does — a
       # fingerprinted asset, or a data blob written once. It is wrong for a
       # document whose URL stays the same across rebuilds. `immutable` tells
       # the browser not to revalidate even on reload, so a visitor who has
       # seen a page before keeps the old copy for a year and never sees an
       # update. On virtualflybrain.org that silently hid every content change
       # from returning visitors, including a rewritten /search/ page and the
       # search index it reads.
       #
       # So: revalidate by default, and opt in to the long immutable cache for
       # the file types that have earned it. Revalidation is cheap — nginx
       # answers with a 304 from the etag.
       # --------------------------------------------------------------------

       # Default. Covers HTML, directory-style pretty URLs (/docs/x/, served
       # from index.html) and anything not matched below.
       location / {
                alias /usr/share/nginx/html/;
                access_log off;
                autoindex off;
                add_header Cache-Control "public, max-age=0, must-revalidate" always;
        }

       # Never cache: one URL, rewritten every build. index.json is the site
       # search index — a stale copy means stale search results with no way
       # for the user to tell.
       location ~* /(?:index\.json|sitemap\.xml|robots\.txt|feed\.xml|index\.xml)$ {
                access_log off;
                add_header Cache-Control "no-cache" always;
        }

       # Safe to cache hard: fingerprinted CSS/JS, fonts, images, and the
       # image and geometry formats served from data.virtualflybrain.org.
       # A given URL here does not change content.
       location ~* \.(?:css|js|mjs|map|woff2?|ttf|otf|eot|png|jpe?g|gif|webp|avif|svg|ico|mp4|webm|ogg|nrrd|obj|swc|wlz|tiff?|h5|n5|zip|gz|bz2|xz)$ {
                access_log off;
                add_header Cache-Control "public, max-age=31536000, immutable" always;
        }

        error_page  404              /404.html;

        error_page 405 =200 @405;
        location @405 {
              root /usr/share/nginx/html/;
              index index.html index.htm index.nginx-debian.html;
        }
}
