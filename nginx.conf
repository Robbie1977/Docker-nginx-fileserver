                                                                                              
user  nginx;                                                                                   
worker_processes  2;                                                                           
                                                                                               
error_log  /var/log/nginx/error.log warn;                                                      
pid        /var/run/nginx.pid;                                                                 
                                                                                               
                                                                                               
events {                                                                                       
    worker_connections  1024;                                                                  
}                                                                                              
                                                                                               
                                                                                               
http {                                                                                         
    include       /etc/nginx/mime.types;                                                       
    default_type  application/octet-stream;     
    
    ssl_session_cache shared:SSL:5m;
    ssl_session_timeout 1h;
                                                                                               
    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '                  
                      '$status $body_bytes_sent "$http_referer" '                              
                      '"$http_user_agent" "$http_x_forwarded_for"';                            
                                                                                               
    access_log  /var/log/nginx/access.log  main;                                               
                                                                                               
    sendfile          on;   
    #tcp_nopush       on;
    tcp_nodelay       on; 
    disable_symlinks  off;
                                                                                               
    keepalive_timeout  1h;                                                                     
                                                                                               
    # gzip was on but with no gzip_types, so nginx compressed text/html and
    # nothing else — JS, CSS, SVG and the Hugo search index all went out raw.
    # index.json alone is ~100 kB uncompressed and ~30 kB gzipped, and every
    # visitor who opens search downloads it.
    gzip              on;
    gzip_vary         on;
    gzip_comp_level   5;
    gzip_min_length   256;
    gzip_proxied      any;
    gzip_types        text/plain
                      text/css
                      text/xml
                      text/javascript
                      application/json
                      application/javascript
                      application/xml
                      application/rss+xml
                      application/manifest+json
                      image/svg+xml;
    # text/html is always compressed and must not be listed here.                                                                                 
                                                                                               
    include /etc/nginx/conf.d/*.conf;                                                          
} 
